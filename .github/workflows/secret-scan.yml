name: Repository Safety Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  block-sensitive-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block ROMs, caches, and generated artifacts
        run: |
          set -euo pipefail
          BLOCKED='\.(bin|ori|mod|hex|s19|srec|mot|frf|sgm|dump|pyc)$|__pycache__|\.pytest_cache|^jobs/|^input/|^output/|^artifacts/'
          if git ls-files | grep -Eiq "$BLOCKED"; then
            echo "Blocked sensitive/generated artifact found:"
            git ls-files | grep -Ei "$BLOCKED"
            exit 1
          fi
