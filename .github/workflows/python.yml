name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy .

      - name: Test
        run: python -m pytest

      - name: Block committed ROM binaries
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(bin|ori|mod|hex|s19|srec|mot|frf|sgm|dump)$'; then
            echo "ROM binary files must not be committed. Remove them from Git tracking."
            exit 1
          fi
